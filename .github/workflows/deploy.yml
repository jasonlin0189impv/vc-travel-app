# Deploy 所有旅程站到 GitHub Pages（gh-pages 分支）。
#
# 流程：功能分支 → 合併到 develop/main → 手動觸發本 workflow（選來源分支）。
#   build：matrix 逐一 build 每個旅程（test 沒過就擋下，不部署壞版本）。
#   deploy：全部 build 成功後，把各 dist 覆蓋到 gh-pages 對應資料夾 + root index.html。
#
# 加一個新旅程 = 只改下面 matrix.trip 清單加一行，其餘全自動。
# clean:false = 只覆蓋各自資料夾、永不誤刪其他 trip。
# ponytail:false 不清舊資料夾，若刪掉某旅程，去 gh-pages 手動移除該資料夾即可。

name: Deploy Trips

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "部署來源分支 (Source Branch)"
        required: true
        default: "develop"
        type: choice
        options:
          - main
          - develop

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.trip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        trip:
          - seoul-trip-2025
          - honeymoon-trip-2026
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install, test, build
        working-directory: ./${{ matrix.trip }}
        run: |
          npm install
          npm run test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.trip }}
          path: ${{ matrix.trip }}/dist/

  deploy:
    name: Deploy to Pages
    needs: build          # 任一 trip build/test 失敗 → 不部署
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts
      - name: Assemble deploy folder
        run: |
          mkdir -p final-deploy
          for d in artifacts/dist-*; do
            trip=$(basename "$d" | sed 's/^dist-//')
            mkdir -p "final-deploy/$trip"
            cp -r "$d"/. "final-deploy/$trip/"
          done
          cp index.html final-deploy/index.html   # root 入口
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final-deploy
          branch: gh-pages
          clean: false     # 只覆蓋各自資料夾，不誤刪其他 trip
