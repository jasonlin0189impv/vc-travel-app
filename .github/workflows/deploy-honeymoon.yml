name: Deploy Honeymoon Trip (2026)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '選擇要部署的來源分支 (Source Branch)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
          - feature/honeymoon-travel-trip

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ./honeymoon-trip-2026
        run: npm install

      - name: Run Unit Tests
        working-directory: ./honeymoon-trip-2026
        run: npm run test

      - name: Build
        working-directory: ./honeymoon-trip-2026
        run: npm run build
        env:
          VITE_AUTH_PIN: ${{ secrets.VITE_AUTH_PIN }}
          VITE_GOOGLE_FORM_ACTION_URL: ${{ secrets.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_GOOGLE_SHEET_CSV_URL: ${{ secrets.VITE_GOOGLE_SHEET_CSV_URL }}
          VITE_GOOGLE_SHEET_PLAN_CSV_URL: ${{ secrets.VITE_GOOGLE_SHEET_PLAN_CSV_URL }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: honeymoon-trip-2026/dist
          branch: gh-pages
          target-folder: honeymoon-trip-2026
