name: Deploy Seoul Trip (2025)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '選擇要部署的來源分支 (Source Branch)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

# 確保 Action 有權限寫入 gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 檢出程式碼，並切換到使用者選擇的分支
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.target_branch }}

      # 2. 設定 Node.js 環境 (建議加上這步以確保版本穩定)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. 安裝依賴並打包
      # 關鍵：加上 working-directory 告訴它進入 seoul-trip-2025 資料夾執行
      - name: Install and Build
        working-directory: ./seoul-trip-2025
        run: |
          npm install
          npm run build
        env:
          # 讀取 Secrets
          VITE_GOOGLE_FORM_ACTION_URL: ${{ secrets.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_GOOGLE_SHEET_CSV_URL: ${{ secrets.VITE_GOOGLE_SHEET_CSV_URL }}

      # 4. 部署到 GitHub Pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 來源資料夾：因為 build 在子目錄，所以是 seoul-trip-2025/dist
          folder: seoul-trip-2025/dist
          
          # 部署分支
          branch: gh-pages
          
          # [進階選項] 為了未來多專案共存 (例如東京、首爾並存)
          # 如果您希望網址是 username.github.io/repo/seoul/
          # 請取消下方註解。如果只想部署在根目錄 (repo/) 則保持現狀。
          # target-folder: seoul