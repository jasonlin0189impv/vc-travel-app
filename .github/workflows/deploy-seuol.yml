name: Deploy Seoul Trip (2025)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: '選擇要部署的來源分支 (Source Branch)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop

permissions:
  contents: write

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./seoul-trip-2025
        run: npm ci

      - name: Run Tests
        working-directory: ./seoul-trip-2025
        run: npm run test

  build-and-deploy:
    name: 🚀 Build & Deploy
    needs: test # 必須等測試通過才執行
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.target_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./seoul-trip-2025
        run: npm ci

      - name: Build Project
        working-directory: ./seoul-trip-2025
        run: npm run build
        env:
          # 建置時必填，因為 Vite 會將這些變數打包進靜態檔案
          VITE_AUTH_PIN: ${{ secrets.VITE_AUTH_PIN }}
          VITE_GOOGLE_FORM_ACTION_URL: ${{ secrets.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_GOOGLE_SHEET_CSV_URL: ${{ secrets.VITE_GOOGLE_SHEET_CSV_URL }}
          VITE_GOOGLE_SHEET_PLAN_CSV_URL: ${{ secrets.VITE_GOOGLE_SHEET_PLAN_CSV_URL }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: seoul-trip-2025/dist
          branch: gh-pages